name: Secret scan

on:
  pull_request:
    branches: [main]
    paths:
      - "Tosca/**"
      - ".trufflehog-exclude"
  push:
    branches: [main]
    paths:
      - "Tosca/**"
      - ".trufflehog-exclude"

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-stepsecurity-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin v3.88.30

      - name: Scan consumer tree for verified secrets
        run: |
          set -euo pipefail
          trufflehog filesystem Tosca \
            --no-update \
            --fail \
            --only-verified \
            --exclude-paths=.trufflehog-exclude
