name: Sign installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign (e.g. tosca/cloud/mcp/1.0.0)
        required: true
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  SIGNPATH_ORG_ID: db074179-6121-4b6d-90bb-32389f664060
  SIGNPATH_PROJECT: GenAI
  SIGNPATH_POLICY: mcp-skills-installers

jobs:
  sign:
    name: sign-installers
    runs-on: ubuntu-stepsecurity-x64
    environment: production
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Resolve product directory from tag
        id: product
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          # tosca/cloud/mcp/1.0.0 -> Tosca/Cloud/MCP
          rel=$(echo "$tag" | sed -E 's|^tosca/||; s|/[0-9]+\.[0-9]+\.[0-9]+$||')
          dir="Tosca/$(echo "$rel" | awk -F/ '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1' OFS="/)"
          if [ ! -d "$dir" ]; then
            echo "Product directory not found for tag $tag: $dir"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Product directory: $dir"

      - name: Build installer bundle
        id: bundle
        run: |
          set -euo pipefail
          dir="${{ steps.product.outputs.dir }}"
          bundle="${dir//\//-}-installers.zip"
          (cd "$dir" && zip -r "../$bundle" $(find . -maxdepth 1 -type f \( -name '*.ps1' -o -name '*.bat' -o -name '*.py' \)))
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Install SignPath osslsigncode
        uses: Tricentis-Infrastructure/templates/.github/actions/signpath/osslsigncode-install@v0.1.0

      - name: Sign installer bundle
        uses: Tricentis-Infrastructure/templates/.github/actions/signpath/osslsigncode@v0.1.0
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        with:
          organization_id: ${{ env.SIGNPATH_ORG_ID }}
          project_slug: ${{ env.SIGNPATH_PROJECT }}
          signing_policy_slug: ${{ env.SIGNPATH_POLICY }}
          artifact_name: mcp-skills-installers
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          artifact_file: ${{ steps.bundle.outputs.bundle }}

      - name: Upload signed bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          signed="signed_${{ steps.bundle.outputs.bundle }}"
          if [ ! -f "$signed" ]; then
            signed="${{ steps.bundle.outputs.bundle }}"
          fi
          gh release upload "${{ steps.tag.outputs.tag }}" "$signed" --clobber
