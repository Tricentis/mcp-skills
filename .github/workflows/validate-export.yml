name: Validate export

on:
  pull_request:
    branches: [main]

jobs:
  validate-export:
    name: validate-export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forbidden paths and required files
        run: python3 scripts/validate_export.py
