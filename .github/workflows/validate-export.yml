name: Validate export

on:
  pull_request:
    branches: [main]

jobs:
  validate-export:
    name: validate-export
    runs-on: ubuntu-stepsecurity-x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Forbidden paths and required files
        run: python3 scripts/validate_export.py
