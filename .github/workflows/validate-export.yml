name: Validate export

on:
  pull_request:
    branches: [main]

jobs:
  validate-export:
    name: validate-export
    runs-on: ubuntu-stepsecurity-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Forbidden paths and required files
        run: python3 scripts/validate_export.py
