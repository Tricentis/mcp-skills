name: Verify signatures

on:
  pull_request:
    branches: [main]
    paths:
      - "Tosca/**"
  push:
    branches: [main]
    paths:
      - "Tosca/**"

permissions:
  contents: read

jobs:
  verify-signatures:
    name: verify-signatures
    runs-on: windows-stepsecurity-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Authenticode on product installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $products = @(
            "Tosca/Cloud/CLI",
            "Tosca/Cloud/MCP",
            "Tosca/Commander/CLI",
            "Tosca/Commander/MCP"
          )
          $failures = @()
          foreach ($product in $products) {
            if (-not (Test-Path $product)) { continue }

            # -Include without a path wildcard is a no-op; use -Filter. .bat is not Authenticode-capable.
            $files = @(Get-ChildItem -Path $product -File -Filter *.ps1 -ErrorAction SilentlyContinue)
            $lib = Join-Path $product "lib"
            if (Test-Path $lib) {
              $files += @(Get-ChildItem -Path $lib -File -Filter *.ps1 -ErrorAction SilentlyContinue)
            }
            if ($files.Count -eq 0) {
              Write-Host "SKIP $product (no .ps1 installers)"
              continue
            }

            $statuses = foreach ($file in $files) {
              [pscustomobject]@{
                Path = $file.FullName
                Status = (Get-AuthenticodeSignature -FilePath $file.FullName).Status
                Subject = (Get-AuthenticodeSignature -FilePath $file.FullName).SignerCertificate.Subject
              }
            }
            $valid = @($statuses | Where-Object { $_.Status -eq "Valid" })
            if ($valid.Count -eq 0) {
              Write-Host "SKIP $product (no Authenticode-signed .ps1 in this checkout yet)"
              continue
            }

            foreach ($row in $statuses) {
              if ($row.Status -ne "Valid") {
                $failures += "$($row.Path): $($row.Status)"
              } else {
                Write-Host "OK $($row.Path) -> $($row.Subject)"
              }
            }
          }
          if ($failures.Count -gt 0) {
            Write-Error ("Unsigned or invalid installer scripts:`n" + ($failures -join "`n") + "`n`nEnsure release .ps1 files are Authenticode-signed before merge.")
          }
