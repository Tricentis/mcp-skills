name: Verify signatures

on:
  pull_request:
    branches: [main]
    paths:
      - "Tosca/**"
      - ".github/workflows/verify-signatures.yml"
  push:
    branches: [main]
    paths:
      - "Tosca/**"
      - ".github/workflows/verify-signatures.yml"

permissions:
  contents: read

jobs:
  verify-signatures:
    name: verify-signatures
    runs-on: windows-stepsecurity-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require Authenticode on user PowerShell scripts
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $failures = [System.Collections.Generic.List[string]]::new()
          $targets = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)

          # Installers and helpers must stay signed. Skill examples are snippets until a PR changes them.
          Get-ChildItem -Path Tosca -Recurse -File -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '[\\/]examples[\\/]' } |
            ForEach-Object { [void]$targets.Add($_.FullName) }

          if ($env:EVENT_NAME -eq "pull_request" -and $env:BASE_SHA) {
            git diff --name-only --diff-filter=AM "$env:BASE_SHA" HEAD |
              Where-Object { $_ -like "*.ps1" -or $_ -like "*.psm1" } |
              ForEach-Object {
                if (Test-Path -LiteralPath $_) {
                  [void]$targets.Add((Resolve-Path -LiteralPath $_).Path)
                }
              }
          }

          if ($targets.Count -eq 0) {
            Write-Error "No user PowerShell scripts found to verify."
          }

          foreach ($path in $targets) {
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.Status -ne "Valid") {
              $failures.Add("${path}: $($sig.Status)")
            } else {
              Write-Host "OK $path -> $($sig.SignerCertificate.Subject)"
            }
          }

          if ($failures.Count -gt 0) {
            Write-Error ("PowerShell scripts must be Authenticode-signed before merge:`n" + ($failures -join "`n"))
          }
