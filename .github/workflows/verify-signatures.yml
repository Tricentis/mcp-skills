name: Verify signatures

on:
  pull_request:
    branches: [main]
    paths:
      - "Tosca/**"
  push:
    branches: [main]
    paths:
      - "Tosca/**"

permissions:
  contents: read

jobs:
  verify-signatures:
    name: verify-signatures
    runs-on: windows-stepsecurity-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Authenticode on product installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $products = @(
            "Tosca/Cloud/CLI",
            "Tosca/Cloud/MCP",
            "Tosca/Commander/CLI",
            "Tosca/Commander/MCP"
          )
          $failures = @()
          foreach ($product in $products) {
            if (-not (Test-Path $product)) { continue }
            Get-ChildItem -Path $product -File -Include *.ps1, *.bat | ForEach-Object {
              $sig = Get-AuthenticodeSignature -FilePath $_.FullName
              if ($sig.Status -ne "Valid") {
                $failures += "$($_.FullName): $($sig.Status)"
              } else {
                Write-Host "OK $($_.FullName) -> $($sig.SignerCertificate.Subject)"
              }
            }
          }
          if ($failures.Count -gt 0) {
            Write-Error ("Unsigned or invalid installer scripts:`n" + ($failures -join "`n") + "`n`nPublish through source repo export CI (SignPath) before opening mcp-skills PR.")
          }
