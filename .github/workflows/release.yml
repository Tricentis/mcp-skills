name: Release

on:
  push:
    branches: [main]
    paths:
      - "Tosca/Commander/MCP/manifest.json"

jobs:
  release:
    name: release
    runs-on: ubuntu-stepsecurity-x64
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('Tosca/Commander/MCP/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=tosca/commander/mcp/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          BRANCH=$(python3 -c "import json; print(json.load(open('Tosca/Commander/MCP/manifest.json'))['sourceBranch'])")
          NOTES="Synced from Tricentis-Tosca/Tosca.Commander.MCP.Integration branch ${BRANCH}. See manifest.json for sourceSha."

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git push origin "$TAG"
          else
            echo "Tag $TAG already on origin; skipping push."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" \
            --title "Tosca Commander MCP $VERSION" \
            --notes "$NOTES"
