name: Release

on:
  push:
    branches: [main]
    paths:
      - "Tosca/**/manifest.json"

jobs:
  release:
    name: release
    runs-on: ubuntu-stepsecurity-x64
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Create tags and GitHub releases for changed products
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/create_product_release.py
