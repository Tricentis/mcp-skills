name: Release

on:
  push:
    branches: [main]
    paths:
      - "Tosca/**/manifest.json"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-stepsecurity-x64
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Create tags and GitHub releases for changed products
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t manifests < <(git diff --name-only HEAD~1 HEAD | grep -E '^Tosca/.+/manifest\.json$' || true)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No consumer manifest.json changes in this push"
            exit 0
          fi

          for manifest in "${manifests[@]}"; do
            dir=$(dirname "$manifest")
            version=$(python3 -c "import json; d=json.load(open('$manifest')); print(d['version'])")
            package=$(python3 -c "import json; d=json.load(open('$manifest')); print(d.get('packageName', 'pack'))")
            rel="${dir#Tosca/}"
            tag="tosca/$(echo "$rel" | tr '[:upper:]' '[:lower:]')/${version}"
            title="$(echo "$rel" | tr '/' ' ') ${version}"
            notes="Tricentis MCP Skills release: ${package} ${version}. Install from ${dir}/ — see README and SHA256SUMS for integrity verification."

            if ! git rev-parse "$tag" >/dev/null 2>&1; then
              git tag -a "$tag" -m "${title}"
            else
              echo "Tag ${tag} already exists locally"
            fi

            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              git push origin "$tag"
              echo "Pushed tag ${tag}"
            else
              echo "Tag ${tag} already on origin"
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release ${tag} already exists"
            else
              gh release create "$tag" --title "$title" --notes "$notes"
              echo "Created GitHub release ${tag}"
            fi
          done
