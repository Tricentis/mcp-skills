name: Release

on:
  push:
    branches: [main]
    paths:
      - "Tosca/Commander/MCP/manifest.json"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('Tosca/Commander/MCP/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=tosca/commander/mcp/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Tosca Commander MCP $VERSION" \
            --notes "Synced from Tricentis-Tosca/Tosca.Commander.MCP.Integration branch 1.0.0. See manifest.json for sourceSha."
